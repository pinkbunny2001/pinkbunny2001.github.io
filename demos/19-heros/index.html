<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heros Demo</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
       <div id="center-hero">
            <div class="content">
                 <h1>Hai Peeps</h1>
                 <p>Im a catchphrase</p>
                 <a href="#" class="btn">Click Me!</a>
            </div> 
       </div> 
       <div id="side-hero">
            <div class="content">
                 <h1>Hai Peeps</h1>
                 <p>Im a catchphrase</p>
                 <a href="#" class="btn">Click Me!</a>
            </div> 
       </div> 
      <div id="contrast-hero">
            <div class="content">
                 <h1>Hai Peeps</h1>
                 <p>Im a catchphrase</p>
                 <a href="#" class="btn">Click Me!</a>
            </div> 
       </div> 
 
    </body>
</html>
<!-- Heroes often have a two container setup in HTML. 
 The first container is the hero holder and will be what we apply the 
 background-image to in CSS. 
 The second container is a child of the first, and will hold the content that 
 lies atop the hero such as headings, text, buttons, links, cards, media & text 
 layouts, etc.
  -->
