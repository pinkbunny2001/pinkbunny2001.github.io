<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="color-palette">
            <h2>Candy Core</h2>
            <h4 id="color-1" class="color">#880044</h4>
            <h4 id="color-2" class="color">#CBC5EA</h4>
            <h4 id="color-3" class="color">#F8DDA4</h4>
            <h4 id="color-4" class="color">#FF6B6B</h4>
            <h4 id="color-5" class="color">#0081A7</h4>
        </div>
        <div class="color-palette">
            <h2> Fun In The Sun</h2>
            <h4 id="c1-1" class="color">#FFD289</h4>
            <h4 id="c2-2" class="color">#FACC6B</h4>
            <h4 id="c3-3" class="color">#FFD131</h4>
            <h4 id="c4-4" class="color">#F5B82E</h4>
            <h4 id="c5-5" class="color">#F4AC32</h4>
        </div>
        <div class="color-palette">
            <h2> Pink Fantasy</h2>
            <h4 id="p2-1" class="color">#F08080</h4>
            <h4 id="p2-2" class="color">#F4978E</h4>
            <h4 id="p2-3" class="color">#F8AD9D</h4>
            <h4 id="p2-4" class="color">#FBC4AB</h4>
            <h4 id="p2-5" class="color">#FFDAB9</h4>
        </div>
    </body>
</html>
