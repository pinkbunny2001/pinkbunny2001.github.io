<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Limited Daily Planner</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <!-- List 1 -->
        <div id="morning">
            <h2>Morning Routine</h2>
            <ul>
                <li class="completed">
                    Take Shower 
                </li>
                <li class="completed">
                    Brush Teeth 
                </li>
                <li class="completed">
                    Take Out Dog 
                </li>
            </ul>
        </div>
        <!-- List 2 -->
        <div id="afternoon">
            <h2>Afternoon Routine</h2>
            <ul>
                <li class="completed">
                    Eat Lunch 
                </li>
                <li class="important">
                    Wash Dishes 
                    <a href="#" class="button">Done?</a>
                </li>
                <li class="completed">
                    Go To Work 
                </li>
            </ul>
        </div>
        <!-- List 3 -->
        <div id="evening">
            <h2>Evening Routine</h2>
            <ul>
                <li class="completed">
                    Sweep Floor 
                </li>
                <li class="important">
                    Wipe counters 
                    <a href="#" class="button">Done?</a>
                </li>
                <li class="important">
                    Stock Items 
                    <a href="#" class="button">Done?</a>
                </li>
            </ul>
        </div>
    </body>
</html>
